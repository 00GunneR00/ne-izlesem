name: neizlesem

services:
  postgres:
    image: postgres:16-alpine
    container_name: neizlesem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neizlesem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neizlesem"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
